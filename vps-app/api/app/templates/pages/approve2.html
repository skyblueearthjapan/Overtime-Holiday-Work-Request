<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>残業・休日出勤申請</title>
  <style>
    :root{
      --bg1:#eaf6ff;
      --bg2:#f7fffb;
      --accent:#1f9d55;
      --accent2:#0ea5e9;
      --text:#0b2545;
      --muted:#5c6b7a;
      --card:#ffffffcc;
      --line:#d7e7f5;
      --danger:#ff5a5f;
      --warn:#ffb020;
    }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      color:var(--text);
      background:
        radial-gradient(1100px 600px at 18% 0%, var(--bg1), transparent),
        radial-gradient(1100px 600px at 92% 20%, var(--bg2), transparent),
        linear-gradient(180deg, #ffffff, #f3fbff);
    }
    header{
      padding:18px 22px;
      display:flex; align-items:flex-end; justify-content:space-between;
      border-bottom:1px solid var(--line);
      backdrop-filter: blur(8px);
      position:sticky; top:0;
      background: rgba(255,255,255,.55);
      z-index: 10;
    }
    .title{ font-weight:900; letter-spacing:.06em; }
    .sub{ opacity:.8; font-size:12px; color:var(--muted); }
    .wrap{ padding:18px 22px; max-width:1280px; margin:0 auto; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px 14px;
      box-shadow: 0 10px 30px rgba(10,40,80,.06);
    }
    .grid{ display:grid; gap:12px; grid-template-columns: 1fr 1fr 1fr 1fr; }
    .kpi{ font-size:22px; font-weight:900; }
    select, input[type="date"]{
      padding:10px 10px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      min-width:160px;
    }
    button{
      padding:10px 12px;
      border-radius:12px;
      border:0;
      background:linear-gradient(135deg, var(--accent), #1bd67f);
      color:#fff; font-weight:800;
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(31,157,85,.20);
    }
    button:disabled{
      opacity:.5; cursor:not-allowed;
    }
    .ghost{
      background:#fff;
      color:var(--text);
      border:1px solid var(--line);
      box-shadow:none;
    }
    .pill{
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      border:1px solid var(--line);
      background:#fff;
      display:inline-block;
      color:var(--text);
    }
    .danger{ border-color:#ffb3b3; background:#fff0f0; color:#7a0b0b; }
    .warn{ border-color:#ffd29e; background:#fff6eb; color:#7a4a0b; }
    .ok{ border-color:#bfe9d0; background:#f0fff6; color:#0b5a2b; }
    .info{ border-color:#b3d9ff; background:#edf6ff; color:#0b3d7a; }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }
    th, td{
      border-bottom:1px solid var(--line);
      padding:10px 8px;
      text-align:left;
      white-space:nowrap;
    }
    th{
      font-size:12px;
      color:var(--muted);
    }
    .muted{ color:var(--muted); }
    a{ color:var(--accent2); text-decoration:none; }
    a:hover{ text-decoration:underline; }
    .nav-link{
      font-size:13px; padding:6px 12px; border-radius:8px;
      border:1px solid var(--line); background:#fff; color:var(--text);
    }
    .nav-link:hover{ background:var(--bg1); text-decoration:none; }
    .portal-link{ background:var(--accent); color:#fff; border-color:var(--accent); }
    .portal-link:hover{ background:#177a43; color:#fff; }

    .bulk-bar{
      display:flex; align-items:center; gap:12px;
      padding:10px 14px;
      background:#f8fcff;
      border:1px solid var(--line);
      border-radius:12px;
      margin-bottom:10px;
    }
    .bulk-bar label{ font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; }
    .bulk-bar .count{ font-weight:800; font-size:14px; }

    tr.disabled td{ opacity:.5; }
    tr.done td{ opacity:.6; }

    .btn-sm{
      padding:6px 10px;
      border-radius:8px;
      font-size:12px;
      border:0;
      background:linear-gradient(135deg, var(--accent), #1bd67f);
      color:#fff; font-weight:700;
      cursor:pointer;
    }
    .btn-sm:disabled{ opacity:.4; cursor:not-allowed; }

    @media (max-width:768px){
      header{ flex-direction:column; align-items:flex-start; gap:8px; }
      .wrap{ padding:12px 10px; }
      .grid{ grid-template-columns:1fr 1fr; }
      .row{ flex-direction:column; align-items:stretch; }
      select, input[type="date"]{ min-width:auto; width:100%; }
      table{ font-size:11px; }
      th, td{ padding:6px 4px; white-space:normal; }
    }
    @media (max-width:480px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
<link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body data-page="approve2">
  <header>
    <div>
      <div class="title">二次承認</div>
      <div class="sub">総務部長による二次承認（一次承認済みの申請を確認・承認）</div>
    </div>
    <div class="row">
      <a href="{{ APP_URL }}?page=admin" target="_top" class="nav-link">総務部画面</a>
      <a href="{{ APP_URL }}?page=approver" target="_top" class="nav-link">承認者画面</a>
      <a href="{{ APP_URL }}?page=top" target="_top" class="nav-link">トップへ</a>
      <a href="{{ PORTAL_URL }}" target="_top" class="nav-link portal-link">社内ポータルへ移動</a>
    </div>
  </header>

  <div class="wrap">

    <!-- Date selector -->
    <div class="card" style="margin-bottom:12px">
      <div class="row">
        <div>
          <div class="sub">対象日</div>
          <input type="date" id="targetDate">
        </div>
        <button data-on-click="loadList">読込</button>
        <div id="loadingMsg" class="sub" style="display:none">読み込み中...</div>
      </div>
    </div>

    <!-- KPIs -->
    <div class="grid" style="margin-bottom:12px; grid-template-columns: 1fr 1fr 1fr 1fr;">
      <div class="card">
        <div class="sub">表示件数</div>
        <div class="kpi" id="kpiTotal">-</div>
      </div>
      <div class="card">
        <div class="sub">承認可能（一次承認済）</div>
        <div class="kpi" id="kpiApproved" style="color:var(--accent)">-</div>
      </div>
      <div class="card">
        <div class="sub">一次未承認</div>
        <div class="kpi" id="kpiPending" style="color:var(--warn)">-</div>
      </div>
      <div class="card">
        <div class="sub">期限超過</div>
        <div class="kpi" id="kpiOverdue" style="color:var(--danger)">-</div>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="bulk-bar">
        <label><input type="checkbox" id="selectAll" data-on-change="toggleSelectAll"> 全選択</label>
        <span class="count"><span id="selectedCount">0</span>件選択中</span>
        <button id="batchBtn" data-on-click="batchApprove" disabled>一括二次承認</button>
      </div>
      <table id="tbl">
        <thead>
          <tr>
            <th style="width:30px"></th>
            <th>部署</th>
            <th>氏名</th>
            <th>対象日</th>
            <th>種別</th>
            <th>予定時間</th>
            <th>一次承認</th>
            <th>二次承認</th>
            <th>PDF</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="sub" style="margin-top:8px">
        ※二次承認を行うとPDFが再生成されます（翌朝バッチで二次承認印付きPDFが作成されます）。
      </div>
    </div>

  </div>

<script type="application/json" id="gas-template-data">{{ data_json|safe }}</script>
<script src="/static/js/gas-shim.js"></script>
<script src="/static/js/approve2.js"></script>
</body>
</html>
