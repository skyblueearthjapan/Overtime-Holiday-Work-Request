# 残業・休日出勤申請 VPS 版の web（nginx）。実装仕様 3-7。
# 公式 nginx イメージの /etc/nginx/conf.d/default.conf に置く想定（http{} の中に読み込まれる）。
# - /static/ だけ nginx が web/static から返す（compose で /usr/share/nginx/html/static に置く）
# - /（画面 5 ページ。?page=）・/api/（RPC と /api/sebastian）・/auth/・/healthz は api コンテナ（FastAPI, :8000）へ中継
# - 入口は Cloudflare Tunnel（cloudflared → http://web:80）。TLS は Cloudflare で終わる。

map $http_x_forwarded_proto $overtime_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 利用者の IP。入口は Cloudflare Tunnel だけ（ホストにポートを出さない）なので、Cloudflare が付ける
# CF-Connecting-IP を使う（無いとき＝コンテナの中からの確認は、つないできた相手の IP）。
map $http_cf_connecting_ip $overtime_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

log_format overtime '$overtime_client_ip - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';

# /api/ の回数制限。社内は同じ IP（会社の出口）からの利用が多いので緩め（1 秒 10 回、バースト 30）。
limit_req_zone $overtime_client_ip zone=overtime_api:10m rate=10r/s;
# Sebastian の入口は認証なしで社外から届くので、IP ごとに 1 分 30 回（セキュリティ 中-1）。
# GAS の転送を通ると送り元が Google の IP になるので、正しい呼び出しも同じ枠を使う（バースト 10 で吸収）。
limit_req_zone $overtime_client_ip zone=overtime_sebastian:10m rate=30r/m;
# ログイン（/auth/）も緩く制限する（1 秒 5 回、バースト 20。セキュリティ 低-3）
limit_req_zone $overtime_client_ip zone=overtime_auth:10m rate=5r/s;
limit_req_status 429;

upstream overtime_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/access.log overtime;

    # RPC の JSON と Sebastian の本文だけなので小さくてよい。
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- セキュリティヘッダ（server レベルに 1 回だけ） ----
    # location の中で add_header を使うと、ここの add_header が引き継がれなくなる（nginx の仕様）。
    # そのため location の中では add_header を使わず、キャッシュは expires で指定する。
    # - script-src 'self': 画面の JS は /static/js/*.js だけ。インラインの script・on 属性は使わない（3-6 の案 1）。
    # - style-src 'unsafe-inline': 今の画面の style 属性と <style> をそのまま使うため（書き換えない）。
    # - frame-ancestors 'self': ほかのサイトへの埋め込みを許さない（Q10 の既定。ポータルが iframe で
    #   埋め込んでいれば、この 1 行を変える）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 画面の JS・CSS（nginx が返す） ----
    location /static/ {
        # 画面を直したらすぐ届くよう、毎回確かめさせる。
        expires -1;
        try_files $uri =404;
    }

    # ---- サーバー（FastAPI）へ中継 ----
    location /api/ {
        # /api/rpc/* と /api/sebastian（Sebastian は PDF の結果を最大 SEBASTIAN_PDF_WAIT_SECONDS 待つ）
        limit_req zone=overtime_api burst=30 nodelay;
        proxy_pass http://overtime_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $overtime_client_ip;
        proxy_set_header X-Forwarded-For $overtime_client_ip;
        proxy_set_header X-Forwarded-Proto $overtime_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
    location = /api/sebastian {
        limit_req zone=overtime_sebastian burst=10 nodelay;
        proxy_pass http://overtime_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $overtime_client_ip;
        proxy_set_header X-Forwarded-For $overtime_client_ip;
        proxy_set_header X-Forwarded-Proto $overtime_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
    # OAuth の code・state を URL ごとアクセスログに残さない（セキュリティ 低-12）
    location = /auth/callback {
        access_log off;
        limit_req zone=overtime_auth burst=20 nodelay;
        proxy_pass http://overtime_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $overtime_client_ip;
        proxy_set_header X-Forwarded-For $overtime_client_ip;
        proxy_set_header X-Forwarded-Proto $overtime_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
    location /auth/ {
        limit_req zone=overtime_auth burst=20 nodelay;
        proxy_pass http://overtime_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $overtime_client_ip;
        proxy_set_header X-Forwarded-For $overtime_client_ip;
        proxy_set_header X-Forwarded-Proto $overtime_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
    location = /healthz {
        proxy_pass http://overtime_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $overtime_client_ip;
        proxy_set_header X-Forwarded-For $overtime_client_ip;
        proxy_set_header X-Forwarded-Proto $overtime_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # ---- 画面（/?page=top など。api の app/pages.py が返す） ----
    location / {
        expires -1;
        proxy_pass http://overtime_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $overtime_client_ip;
        proxy_set_header X-Forwarded-For $overtime_client_ip;
        proxy_set_header X-Forwarded-Proto $overtime_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
