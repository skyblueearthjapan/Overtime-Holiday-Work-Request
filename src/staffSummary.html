<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタッフビュー画面 — 月次 残業・休日出勤 集計</title>
<style>
  :root{
    --bg1:#eaf6ff; --bg2:#f7fffb;
    --accent:#1f9d55;   /* 緑：休日出勤 */
    --accent2:#0ea5e9;  /* 青：残業 */
    --text:#0b2545; --muted:#5c6b7a;
    --card:#ffffffcc; --cardSolid:#ffffff; --line:#d7e7f5;
    --danger:#ff5a5f; --warn:#ffb020;
    --pill-ok-bg:#f0fff6; --pill-ok-bd:#bfe9d0; --pill-ok-tx:#0b5a2b;
    --pill-warn-bg:#fff6eb; --pill-warn-bd:#ffd29e; --pill-warn-tx:#7a4a0b;
    --pill-info-bg:#f0f7ff; --pill-info-bd:#b3d4ff; --pill-info-tx:#0b2a5a;
    --pill-danger-bg:#fff0f0; --pill-danger-bd:#ffb3b3; --pill-danger-tx:#7a0b0b;
    --track:#e7f0f8;
    --shadow:0 10px 30px rgba(10,40,80,.06);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    background:
      radial-gradient(1200px 600px at 12% -8%, var(--bg1), transparent 60%),
      radial-gradient(1000px 560px at 110% 0%, var(--bg2), transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    min-height:100vh;
  }
  .wrap{ max-width:1040px; margin:0 auto; padding:18px 16px 60px; }
  .tabnum{ font-variant-numeric: tabular-nums; }

  header.app{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    margin-bottom:14px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo{ width:40px; height:40px; border-radius:12px; flex:none;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    box-shadow:var(--shadow); display:grid; place-items:center; color:#fff; font-weight:900; }
  .brand h1{ font-size:18px; margin:0; letter-spacing:.02em; }
  .brand .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .headright{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .whoami{ font-size:13px; color:var(--muted); }
  .whoami .who{ font-weight:800; color:var(--text); }
  .navrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .nav-link{ font-size:13px; padding:6px 12px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--text); text-decoration:none; }
  .nav-link:hover{ background:var(--bg1); text-decoration:none; }
  .portal-link{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .portal-link:hover{ background:#177a43; color:#fff; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px; box-shadow:var(--shadow); margin-bottom:16px;
    backdrop-filter: blur(6px);
  }
  .sectionTitle{ font-weight:900; letter-spacing:.05em; display:flex; align-items:center;
    justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
  .sectionTitle .lead{ display:flex; align-items:center; gap:10px; }
  .dot{ width:10px; height:10px; border-radius:3px; background:var(--accent2); }
  .section-count{ font-size:13px; font-weight:800; color:var(--accent2); }
  .loading{ text-align:center; padding:30px; color:var(--muted); font-size:13px; }

  /* --- 検索バー --- */
  .filters{ display:grid; gap:12px; grid-template-columns: auto 1fr 1fr; align-items:end; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--muted);
    text-transform:uppercase; }
  select{ appearance:none; -webkit-appearance:none;
    padding:10px 34px 10px 12px; border-radius:12px; border:1px solid var(--line);
    background:var(--cardSolid)
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235c6b7a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>")
      no-repeat right 10px center;
    color:var(--text); font-size:14px; font-weight:700; cursor:pointer; width:100%; }
  .monthNav{ display:flex; align-items:stretch; gap:8px; }
  .monthNav .navbtn{ width:40px; border-radius:12px; border:1px solid var(--line);
    background:var(--cardSolid); color:var(--text); font-size:18px; font-weight:900; cursor:pointer; }
  .monthNav .navbtn:hover{ border-color:var(--accent2); color:var(--accent2); }
  .monthBox{ min-width:190px; text-align:center; border:1px solid var(--line);
    border-radius:12px; background:var(--cardSolid); padding:6px 12px; display:flex;
    flex-direction:column; justify-content:center; }
  .monthBox .m{ font-size:16px; font-weight:900; }
  .monthBox .p{ font-size:11px; color:var(--muted); margin-top:1px; }
  .hint{ font-size:12px; color:var(--muted); margin-top:10px; display:flex; gap:6px; align-items:center; }

  /* --- 個人ビュー：ターゲット見出し＋KPI --- */
  .targetHead{ display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .avatar{ width:44px; height:44px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-weight:900; color:#fff; background:linear-gradient(135deg,#38bdf8,var(--accent2)); }
  .targetHead .nm{ font-size:17px; font-weight:900; }
  .targetHead .dp{ font-size:12px; color:var(--muted); }

  .kpiGrid{ display:grid; gap:12px; grid-template-columns: 1.4fr 1fr 1fr 1fr; }
  .kpi{ border:1px solid var(--line); border-radius:14px; padding:14px; background:var(--cardSolid);
    position:relative; overflow:hidden; }
  .kpi .k-label{ font-size:12px; font-weight:800; color:var(--muted); }
  .kpi .k-val{ font-size:26px; font-weight:900; margin-top:6px; line-height:1.05; }
  .kpi .k-sub{ font-size:11px; color:var(--muted); margin-top:4px; }
  .kpi.total{ background:linear-gradient(135deg, rgba(14,165,233,.10), rgba(31,157,85,.10)); }
  .kpi.total .k-val{ font-size:30px; }
  .kpi .rail{ position:absolute; left:0; top:0; bottom:0; width:5px; }
  .kpi.ot .rail{ background:var(--accent2); }
  .kpi.hol .rail{ background:var(--accent); }
  .kpi.pend .rail{ background:var(--warn); }
  .kpi.ot .k-val{ color:var(--accent2); }
  .kpi.hol .k-val{ color:var(--accent); }
  .kpi.pend .k-val{ color:#c98209; }

  /* 上限ゲージ（40時間＝上限 / 60時間＝特別枠の上限） */
  .gauge{ margin-top:14px; border:1px solid var(--line); border-radius:14px; padding:14px; background:var(--cardSolid); }
  .gauge .g-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:12px; font-weight:800; color:var(--muted); margin-bottom:10px; gap:8px; flex-wrap:wrap; }
  .gauge .g-top .big{ font-size:15px; color:var(--text); }
  .gaugeBar{ position:relative; height:70px; }
  .gl{ position:absolute; top:0; transform:translateX(-50%); font-size:11px; font-weight:800; white-space:nowrap;
    padding:1px 7px; border-radius:7px; border:1px solid var(--line); background:var(--cardSolid); z-index:2; }
  .gl.g40{ color:#0b2545; border-color:#b9c6d8; }
  .gl.g60{ color:var(--danger); border-color:#ffc2c2; }
  .track{ position:absolute; left:0; right:0; top:27px; height:18px; border-radius:999px; overflow:hidden; }
  .track .fill{ position:absolute; left:0; top:0; bottom:0; border-radius:999px 0 0 999px; opacity:.92; }
  .fill.ok{ background:var(--accent); }
  .fill.warn{ background:var(--warn); }
  .fill.danger{ background:var(--danger); }
  .line{ position:absolute; top:21px; height:30px; width:2px; transform:translateX(-50%); z-index:1; }
  .line.l40{ background:#0b2545; }
  .line.l60{ background:var(--danger); }
  .curtick{ position:absolute; top:52px; transform:translateX(-50%); font-size:10px; font-weight:800;
    color:var(--text); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .g-legend{ display:flex; gap:14px; margin-top:6px; font-size:11px; color:var(--muted); flex-wrap:wrap; }
  .g-legend .sw{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .sw.green{ background:var(--accent); } .sw.amber{ background:var(--warn); } .sw.red{ background:var(--danger); }
  .annual{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px; padding-top:12px;
    border-top:1px dashed var(--line); font-size:12px; color:var(--muted); }
  .annual .lbl{ font-weight:800; color:var(--text); }
  .annual .cnt{ font-weight:900; color:var(--text); }
  .dots{ letter-spacing:3px; font-size:14px; }
  .dots .on{ color:var(--warn); }
  .dots .off{ color:var(--line); }
  .annual .rest{ margin-left:auto; }
  .annual .rest.zero{ color:var(--danger); font-weight:800; }

  /* --- テーブル共通 --- */
  .tableWrap{ overflow-x:auto; margin-top:16px; border-radius:12px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
  th, td{ border-bottom:1px solid var(--line); padding:11px 10px; text-align:left; white-space:nowrap; }
  th{ font-size:11px; color:var(--muted); font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
  td.num, th.num{ text-align:right; font-variant-numeric: tabular-nums; }
  tbody tr:hover{ background:color-mix(in srgb, var(--accent2) 6%, transparent); }
  .typeChip{ font-size:11px; font-weight:800; padding:3px 9px; border-radius:8px; display:inline-block; }
  .typeChip.ot{ color:var(--accent2); background:var(--pill-info-bg); border:1px solid var(--pill-info-bd); }
  .typeChip.hol{ color:var(--accent); background:var(--pill-ok-bg); border:1px solid var(--pill-ok-bd); }
  .pill{ padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid var(--line);
    background:var(--cardSolid); display:inline-block; }
  .pill.ok{ border-color:var(--pill-ok-bd); background:var(--pill-ok-bg); color:var(--pill-ok-tx); }
  .pill.warn{ border-color:var(--pill-warn-bd); background:var(--pill-warn-bg); color:var(--pill-warn-tx); }
  .pill.danger{ border-color:var(--pill-danger-bd); background:var(--pill-danger-bg); color:var(--pill-danger-tx); }
  .pdflink{ color:var(--accent2); font-weight:800; text-decoration:none; }
  .pdfnone{ color:var(--muted); }
  .yrcnt{ font-size:11px; color:var(--muted); font-weight:700; margin-left:2px; }

  .mini{ display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .minibar{ width:88px; height:8px; border-radius:999px; background:var(--track); overflow:hidden; flex:none; }
  .minibar > span{ display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); }
  .rowname{ font-weight:800; }
  .rowdept{ font-size:11px; color:var(--muted); }
  .totrow td{ border-top:2px solid var(--line); font-weight:900; background:color-mix(in srgb, var(--accent2) 5%, transparent); }

  .fade{ animation:fade .25s ease both; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .fade{ animation:none; } }

  @media (max-width:820px){
    .filters{ grid-template-columns:1fr; }
    .kpiGrid{ grid-template-columns:1fr 1fr; }
    header.app{ align-items:flex-start; }
    .headright{ align-items:flex-start; }
  }
  @media (max-width:520px){
    .kpiGrid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="app">
    <div class="brand">
      <div class="logo">残</div>
      <div>
        <h1>スタッフビュー画面</h1>
        <div class="sub">残業・休日出勤 月次集計（社内）</div>
      </div>
    </div>
    <div class="headright">
      <div class="whoami">ログイン：<span class="who" id="whoName">—</span></div>
      <div class="navrow">
        <a href="<?= APP_URL ?>?page=top" target="_top" class="nav-link">トップへ</a>
        <a href="<?= PORTAL_URL ?>" target="_top" class="nav-link portal-link">社内ポータルへ移動</a>
      </div>
    </div>
  </header>

  <!-- ===== 検索カード ===== -->
  <section class="card">
    <div class="sectionTitle">
      <div class="lead"><span class="dot"></span><span>月次 残業・休日出勤 集計</span></div>
      <div class="section-count" id="periodLabel">—</div>
    </div>
    <div class="filters">
      <div class="field">
        <label>対象月（締め）</label>
        <div class="monthNav">
          <button class="navbtn" id="prevM" type="button" aria-label="前の月">‹</button>
          <div class="monthBox">
            <div class="m" id="monthM">—</div>
            <div class="p" id="monthP">—</div>
          </div>
          <button class="navbtn" id="nextM" type="button" aria-label="次の月">›</button>
        </div>
      </div>
      <div class="field">
        <label>部署</label>
        <select id="deptSel"><option value="">全部署</option></select>
      </div>
      <div class="field">
        <label>スタッフ</label>
        <select id="staffSel"><option value="">全員</option></select>
      </div>
    </div>
    <div class="hint">🔎 どの部署・どのスタッフでも検索できます。部署を選ぶとスタッフを指定でき、指定で本人の明細、「全員」で部署一覧になります。</div>
  </section>

  <!-- ===== 結果（個人ビュー / 一覧ビュー） ===== -->
  <section class="card"><div id="resultBody"><div class="loading">読み込み中...</div></div></section>

</div>

<script>
  var deptSel = document.getElementById('deptSel');
  var staffSel = document.getElementById('staffSel');
  var resultBody = document.getElementById('resultBody');

  // ---- 締め月の状態 ----
  function curClosingYm(){
    var d = new Date(), y = d.getFullYear(), m = d.getMonth()+1;
    if(d.getDate() <= 15){ m -= 1; if(m===0){ m=12; y-=1; } }
    return { y:y, m:m };
  }
  var CUR = curClosingYm();
  var state = { ym:{ y:CUR.y, m:CUR.m }, dept:'', staff:'' };

  function ymStr(o){ return o.y + '-' + ('0'+o.m).slice(-2); }
  function addMonth(o, delta){ var idx = o.y*12 + (o.m-1) + delta; return { y:Math.floor(idx/12), m:(idx%12)+1 }; }
  function isFuture(o){ return (o.y*12 + o.m) > (CUR.y*12 + CUR.m); }
  function monthLabel(o){ return o.y + '年 ' + o.m + '月分'; }
  function periodStr(o){ var n = addMonth(o,1); return o.m + '/16 〜 ' + n.m + '/15'; }

  function setMonthUI(){
    document.getElementById('monthM').textContent = monthLabel(state.ym);
    document.getElementById('monthP').textContent = '締め期間 ' + periodStr(state.ym);
    document.getElementById('periodLabel').textContent = periodStr(state.ym);
  }

  function fmtMin(min){ min=Math.round(min); var h=Math.floor(min/60), m=min%60;
    if(h===0) return m+'分'; if(m===0) return h+'時間'; return h+'時間'+m+'分'; }
  function hm(min){ min=Math.round(min); var h=Math.floor(min/60), m=min%60; return h+':'+('0'+m).slice(-2); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // ---- セレクタ ----
  function renderDeptOptions(depts){
    deptSel.innerHTML = '<option value="">全部署</option>' +
      depts.map(function(d){ return '<option value="'+esc(d)+'">'+esc(d)+'</option>'; }).join('');
    deptSel.value = state.dept;
  }
  function renderStaffOptions(list){
    var opts = '<option value="">全員</option>';
    for(var i=0;i<list.length;i++){
      var tok = String(list[i]); var sp = tok.indexOf(' ');
      var name = sp>=0 ? tok.slice(sp+1) : tok;
      opts += '<option value="'+esc(tok)+'">'+esc(name)+'</option>';
    }
    staffSel.innerHTML = opts;
    staffSel.value = state.staff;
  }
  function loadStaff(cb){
    if(!state.dept){
      state.staff=''; staffSel.innerHTML='<option value="">全員</option>'; staffSel.value='';
      if(cb) cb(); return;
    }
    google.script.run
      .withSuccessHandler(function(list){
        list = list || []; renderStaffOptions(list);
        var ok=false; for(var i=0;i<list.length;i++){ if(String(list[i])===state.staff){ ok=true; break; } }
        if(!ok){ state.staff=''; staffSel.value=''; }
        if(cb) cb();
      })
      .withFailureHandler(function(){ state.staff=''; staffSel.innerHTML='<option value="">全員</option>'; if(cb) cb(); })
      .api_getWorkersByDept(state.dept);
  }

  // ---- 検索・描画 ----
  function render(){
    setMonthUI();
    resultBody.classList.remove('fade'); void resultBody.offsetWidth; resultBody.classList.add('fade');
    resultBody.innerHTML = '<div class="loading">読み込み中...</div>';
    google.script.run
      .withSuccessHandler(function(res){
        if(!res){ resultBody.innerHTML = '<div class="loading">データがありません</div>'; return; }
        resultBody.innerHTML = (res.mode==='personal') ? renderPerson(res) : renderList(res);
      })
      .withFailureHandler(function(err){
        resultBody.innerHTML = '<div class="loading">読み込みに失敗しました：' + esc(err && err.message || err) + '</div>';
      })
      .api_getClosingSummary(ymStr(state.ym), state.dept, state.staff);
  }

  function renderPerson(res){
    var w=res.worker, k=res.kpi, meta=res.meta;
    var initials = (w.workerName||'—').slice(0,1);
    var LIM40 = meta.limit40, LIM60 = meta.limit60, MAX = 4200;
    var total = k.totalNet;
    var pct = Math.min(100, Math.round((total/MAX)*1000)/10);
    var p40 = (LIM40/MAX*100).toFixed(2);
    var p60 = (LIM60/MAX*100).toFixed(2);
    var zoneBg = 'linear-gradient(90deg,#e9f7ef 0 '+p40+'%,#fff4e2 '+p40+'% '+p60+'%,#ffeceb '+p60+'% 100%)';
    var over = total>LIM60 ? 'danger' : (total>LIM40 ? 'warn' : 'ok');
    var overTxt = total>LIM60 ? '60時間 超過' : (total>LIM40 ? '40時間 超（年6回のうち）' : '40時間内');
    var yr = res.annualOver, rest = 6 - yr;
    var dots=''; for(var di=0; di<6; di++){ dots += '<span class="'+(di<yr?'on':'off')+'">●</span>'; }

    var rows = res.detail.map(function(r){
      var pdf = r.pdfFileId
        ? '<a class="pdflink" target="_blank" href="https://drive.google.com/file/d/'+esc(r.pdfFileId)+'/view">PDF</a>'
        : '<span class="pdfnone">—</span>';
      return '<tr>'+
        '<td class="tabnum">'+esc(r.date)+'</td>'+
        '<td><span class="typeChip '+(r.type==='overtime'?'ot':'hol')+'">'+(r.type==='overtime'?'残業':'休日出勤')+'</span></td>'+
        '<td class="num">'+(r.approvedMinutes?hm(r.approvedMinutes):'—')+'</td>'+
        '<td class="num">'+(r.netMinutes?hm(r.netMinutes):'—')+'</td>'+
        '<td class="num">'+(r.breakMinutes?hm(r.breakMinutes):'—')+'</td>'+
        '<td>'+(r.status==='approved'?'<span class="pill ok">承認済</span>':'<span class="pill warn">申請中</span>')+'</td>'+
        '<td>'+pdf+'</td>'+
      '</tr>';
    }).join('');
    if(!rows) rows = '<tr><td colspan="7" class="loading">この月のデータはありません</td></tr>';

    var pendTxt = k.pendMin ? ('＋'+fmtMin(k.pendMin)) : '—';

    return ''+
    '<div class="targetHead">'+
      '<div class="avatar">'+esc(initials)+'</div>'+
      '<div><div class="nm">'+esc(w.workerName||'—')+'</div><div class="dp">'+esc(w.dept||'')+'　/　'+esc(meta.monthLabel)+'</div></div>'+
      '<div style="flex:1"></div>'+
      '<span class="pill '+over+'">'+overTxt+'</span>'+
    '</div>'+
    '<div class="kpiGrid">'+
      '<div class="kpi total"><div class="k-label">合計（実働）</div><div class="k-val tabnum">'+fmtMin(total)+'</div><div class="k-sub">承認済 ・ 上限40時間（超過は年6回・60時間まで）</div></div>'+
      '<div class="kpi ot"><span class="rail"></span><div class="k-label">残業</div><div class="k-val tabnum">'+fmtMin(k.otNet)+'</div><div class="k-sub">netMinutes</div></div>'+
      '<div class="kpi hol"><span class="rail"></span><div class="k-label">休日出勤</div><div class="k-val tabnum">'+fmtMin(k.holNet)+'</div><div class="k-sub">netMinutes</div></div>'+
      '<div class="kpi pend"><span class="rail"></span><div class="k-label">見込み（実績待ち/申請中）</div><div class="k-val tabnum">'+pendTxt+'</div><div class="k-sub">承認予定・参考値</div></div>'+
    '</div>'+
    '<div class="gauge">'+
      '<div class="g-top"><span>合計（残業＋休日出勤）の上限基準</span><span><span class="big tabnum">'+fmtMin(total)+'</span> ／ 上限 40時間</span></div>'+
      '<div class="gaugeBar">'+
        '<span class="gl g40" style="left:'+p40+'%">40時間</span>'+
        '<span class="gl g60" style="left:'+p60+'%">60時間</span>'+
        '<div class="track" style="background:'+zoneBg+'"><div class="fill '+over+'" style="width:'+pct+'%"></div></div>'+
        '<div class="line l40" style="left:'+p40+'%"></div>'+
        '<div class="line l60" style="left:'+p60+'%"></div>'+
        '<div class="curtick" style="left:'+pct+'%">▲ '+hm(total)+'</div>'+
      '</div>'+
      '<div class="g-legend">'+
        '<span><i class="sw green"></i>40時間まで（上限内）</span>'+
        '<span><i class="sw amber"></i>40〜60時間（年6回まで）</span>'+
        '<span><i class="sw red"></i>60時間 超過（不可）</span>'+
      '</div>'+
      '<div class="annual">'+
        '<span class="lbl">'+esc(meta.fyLabel)+' 40時間超：</span>'+
        '<span class="dots">'+dots+'</span>'+
        '<span><span class="cnt">'+yr+'</span> / 6 回</span>'+
        '<span class="rest'+(rest<=0?' zero':'')+'">残り '+Math.max(0,rest)+' 回</span>'+
      '</div>'+
    '</div>'+
    '<div class="tableWrap"><table>'+
      '<thead><tr><th>対象日</th><th>種別</th><th class="num">承認</th><th class="num">実績(net)</th><th class="num">休憩</th><th>状態</th><th>個票</th></tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
    '</table></div>';
  }

  function renderList(res){
    var people = res.people, meta = res.meta;
    var max = 1;
    for(var i=0;i<people.length;i++){ if(people[i].totalNet>max) max = people[i].totalNet; }
    var sum = { ot:0, hol:0, tot:0, pend:0 };
    var rows = people.map(function(p){
      var w = Math.round((p.totalNet/max)*100);
      sum.ot+=p.otNet; sum.hol+=p.holNet; sum.tot+=p.totalNet; sum.pend+=p.pendMin;
      var flag = p.totalNet>meta.limit60 ? '<span class="pill danger">60時間超</span>'
               : (p.totalNet>meta.limit40 ? '<span class="pill warn">40時間超</span>'
               : '<span class="pill ok">上限内</span>');
      flag += ' <span class="yrcnt">年'+p.annualOver+'/6</span>';
      return '<tr>'+
        '<td><div class="rowname">'+esc(p.workerName)+'</div><div class="rowdept">'+esc(p.dept)+'</div></td>'+
        '<td class="num tabnum">'+hm(p.otNet)+'</td>'+
        '<td class="num tabnum">'+hm(p.holNet)+'</td>'+
        '<td class="num"><div class="mini"><span class="tabnum">'+hm(p.totalNet)+'</span><span class="minibar"><span style="width:'+w+'%"></span></span></div></td>'+
        '<td class="num tabnum">'+(p.pendMin?'＋'+hm(p.pendMin):'—')+'</td>'+
        '<td>'+flag+'</td>'+
      '</tr>';
    }).join('');
    if(!rows) rows = '<tr><td colspan="6" class="loading">この条件のデータはありません</td></tr>';

    var scope = res.dept ? res.dept : '全部署';
    return ''+
    '<div class="sectionTitle" style="margin-bottom:8px">'+
      '<div class="lead"><span>スタッフ別 一覧 — '+esc(scope)+'</span></div>'+
      '<div class="section-count">'+people.length+'名 ・ '+esc(meta.monthLabel)+'</div>'+
    '</div>'+
    '<div class="tableWrap"><table>'+
      '<thead><tr><th>氏名 / 部署</th><th class="num">残業</th><th class="num">休日出勤</th><th class="num">合計（実働）▼</th><th class="num">見込み</th><th>状況</th></tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
      '<tfoot><tr class="totrow">'+
        '<td>合計（'+people.length+'名）</td>'+
        '<td class="num tabnum">'+hm(sum.ot)+'</td>'+
        '<td class="num tabnum">'+hm(sum.hol)+'</td>'+
        '<td class="num tabnum">'+hm(sum.tot)+'</td>'+
        '<td class="num tabnum">'+(sum.pend?'＋'+hm(sum.pend):'—')+'</td>'+
        '<td></td>'+
      '</tr></tfoot>'+
    '</table></div>'+
    '<div class="hint" style="margin-top:12px">💡 部署を選び、上のプルダウンでスタッフを指定すると、その人の日別明細が開きます。</div>';
  }

  // ---- イベント ----
  document.getElementById('prevM').addEventListener('click', function(){ state.ym = addMonth(state.ym,-1); render(); });
  document.getElementById('nextM').addEventListener('click', function(){ var n = addMonth(state.ym,1); if(!isFuture(n)){ state.ym = n; render(); } });
  deptSel.addEventListener('change', function(){ state.dept = deptSel.value; loadStaff(function(){ render(); }); });
  staffSel.addEventListener('change', function(){ state.staff = staffSel.value; render(); });

  // ---- 初期化：部署一覧→本人（初期選択）→描画 ----
  function init(){
    google.script.run
      .withSuccessHandler(function(depts){
        depts = depts || []; renderDeptOptions(depts);
        google.script.run
          .withSuccessHandler(function(me){
            if(me && me.workerName){ document.getElementById('whoName').textContent = me.workerName + '（' + (me.dept||'') + '）'; }
            if(me && me.dept){
              state.dept = me.dept; deptSel.value = me.dept;
              google.script.run
                .withSuccessHandler(function(list){
                  list = list || []; renderStaffOptions(list);
                  var tok = '';
                  for(var i=0;i<list.length;i++){ if(String(list[i]).split(/\s+/)[0] === me.workerCode){ tok = String(list[i]); break; } }
                  state.staff = tok; staffSel.value = tok;
                  render();
                })
                .withFailureHandler(function(){ render(); })
                .api_getWorkersByDept(me.dept);
            } else { render(); }
          })
          .withFailureHandler(function(){ render(); })
          .api_getWorkerInfo();
      })
      .withFailureHandler(function(){ renderDeptOptions([]); render(); })
      .api_getDeptList();
  }
  init();
</script>
</body>
</html>
